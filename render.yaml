# Blueprint Render : un service web Python + une base PostgreSQL gratuite.
databases:
  - name: radar-pnd-db
    plan: free
    region: frankfurt
    databaseName: radarpnd
    user: radarpnd

services:
  - type: web
    name: radar-pnd
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn radarpnd.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: radar-pnd-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://radar-pnd.onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CREATE_DEMO
        value: "0"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: CHARIOW_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
