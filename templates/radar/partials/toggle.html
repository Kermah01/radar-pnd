{% if a_acces %}<form class="js-toggle" method="post" action="{% url 'radar:selection_toggle' a.code %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button class="star-btn" type="submit" aria-pressed="{% if a.id in ids_sel %}true{% else %}false{% endif %}" aria-label="{% if a.id in ids_sel %}Retirer de ma sélection{% else %}Ajouter à ma sélection{% endif %}" data-aria-on="Retirer de ma sélection" data-aria-off="Ajouter à ma sélection" title="Ajouter à ma sélection ou l'en retirer"><svg class="ico"><use href="#i-star"/></svg></button>
</form>{% endif %}
